name: Weekly data collection
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect a new vintage
        run: |
          PREV=$(ls -d data/vintage_* | sort | tail -1)
          END=$(date -u -d "yesterday" +%F)
          python3 pipeline/collect.py --end "$END" --carry-tranco "$PREV"
      - run: python3 pipeline/build.py
      - name: Commit the vintage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git commit -m "Collect vintage $(date -u +%F)" || echo "nothing to commit"
          git push
